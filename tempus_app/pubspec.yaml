name: tempus_app
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.1
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.5.0
  dynamic_background: ^0.5.0
  flutter_moving_background: ^0.0.5
  screen_brightness: ^1.0.0
  wakelock_plus: any
  sensors_plus: ^3.1.0
  vibration: any
  flutter_svg: ^2.0.0
  flutter_sound: ^9.3.0
  permission_handler: ^11.3.1
  auto_size_text: ^3.0.0
  google_mobile_ads: ^5.2.0
  shared_preferences: ^2.3.0
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  share_plus: ^10.1.4
  screenshot: ^3.0.0
  home_widget: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.3

flutter_native_splash:
  color: "#06040A"
  color_dark: "#06040A"
  android_12:
    color: "#06040A"
    icon_background_color: "#06040A"
    color_dark: "#06040A"
    icon_background_color_dark: "#06040A"

flutter:
  uses-material-design: true

  assets:
    - lib/assets/icons/
    - lib/assets/sounds/beep.mp3